[package]
name = "rusty-cargo"
version = "0.1.0"
edition = "2024"
description = "cargo wrapper: transparent pass-through, opt-in agent mode"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
similar = "3.2.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
